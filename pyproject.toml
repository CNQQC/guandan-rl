[project]
name = "guandan-lab"
version = "0.1.0"
description = "掼蛋自我对弈研究：DMC、Transformer、对手池与可复现评测"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "onnxruntime>=1.20,<2",
  "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["vendor", "fabledan"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
